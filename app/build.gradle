plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debedb.touchgrass'
    compileSdk 34

    defaultConfig {
        applicationId 'com.debedb.touchgrass'
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
